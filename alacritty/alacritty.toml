[general]
live_config_reload = true
working_directory = "C:/Users/hybl/"

import = ['zenbones_dark.toml']

[window]
dynamic_padding = true

[font]
normal = { family = "Lilex Nerd Font", style = "Regular" }
bold = { family = "Lilex Nerd Font", style = "Bold" }
italic = { family = "Lilex Nerd Font", style = "Italic" }
bold_italic = { family = "Lilex Nerd Font", style = "Bold Italic" }
size = 11

[terminal]
shell = "nu"

[mouse]
hide_when_typing = true


[keyboard]
bindings = [
  { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "T", mods = "Control|Shift", action = "CreateNewTab" },
]
