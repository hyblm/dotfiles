# Use C-a as the prefix key.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start windows and panes at 1 for easier keyboard selection.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Improve terminal support and colors.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

# Use Nushell by default.
set -g default-shell "/usr/bin/nu"
set -g default-command "/usr/bin/nu"

# Quality-of-life settings.
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g status-interval 5
setw -g mode-keys vi

# Splits open in the current pane's directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Prefix-free splits.
bind-key -n M-o split-window -h -c "#{pane_current_path}"
bind-key -n M-O split-window -hb -c "#{pane_current_path}"

# Reload config quickly.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Vim-like pane navigation.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Prefix-free pane navigation with Alt+hjkl and Alt+arrow keys.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Up select-pane -U
bind-key -n M-Right select-pane -R

# Prefix-free window navigation with Alt+Shift+h/l and Alt+Shift+left/right.
bind-key -n M-H previous-window
bind-key -n M-L next-window
bind-key -n M-S-Left previous-window
bind-key -n M-S-Right next-window

# Resize panes with repeated prefix + H/J/K/L.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Simple status line.
set -g status-position bottom
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour81,bold]#S #[fg=colour245]"
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour81]%H:%M"
set -g window-status-current-style "fg=colour81,bold"
