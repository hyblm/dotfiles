[[language]]
name="rust"
auto-format = true

[language-server.rust-analyzer.config]
check = {command = "clippy", extraArgs = ["--", "-W", "clippy::unwrap_used", "-W", "clippy::expect_used", "-W", "clippy::pedantic", "-A", "clippy::must_use_candidate", "-A", "clippy::missing_errors_doc"]}
cargo = {allFeatures = true}
# procMacro = {enable = true }

